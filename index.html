<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d1d">
  <title>Goal Hunter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="brand">⚽ GOAL <span>HUNTER</span></div>
      <div class="date-card">
        <div id="date">—</div>
        <small>Ghana Time</small>
      </div>
      <h1>GG2+ &amp; Both Halves</h1>
      <p>High-scoring leagues only · Ghana time · daily update</p>
    </header>

    <nav class="market-tabs" aria-label="Markets">
      <button class="market active" data-market="all">All Markets</button>
      <button class="market" data-market="GG2+">GG2+ — both teams 2+</button>
      <button class="market" data-market="BOTH_HALVES">Both Teams Score Both Halves</button>
    </nav>

    <div id="updated" class="updated">Last updated: —</div>
    <div id="app"></div>

    <footer>
      <strong>Goal Hunter</strong>
      <span>Model percentages are estimates, not guarantees.</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
