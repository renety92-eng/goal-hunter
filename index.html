<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080d1d">

  <meta name="description" content="Goal Hunter - GG2+ and Both Teams Score Both Halves">

  <title>Goal Hunter</title>

  <link rel="stylesheet" href="styles.css">

</head>

<body>

  <main class="app">

    <!-- HEADER -->

    <header class="hero">

      <div class="top-bar">

        <div class="brand">

          ⚽ GOAL <span>HUNTER</span>

        </div>

        <div class="date-card">

          <div id="date">—</div>

          <small>Ghana Time</small>

        </div>

      </div>

      <div class="hero-content">

        <h1>GG2+ &amp;<br>Both Halves</h1>

        <p>

          High-scoring leagues only · Ghana time · daily update

        </p>

      </div>

    </header>

    <!-- MARKET FILTERS -->

    <nav class="market-tabs" aria-label="Market filters">

      <button

        class="market active"

        data-market="all"

        type="button">

        All Markets

      </button>

      <button

        class="market"

        data-market="GG2+"

        type="button">

        GG2+ — both teams 2+

      </button>

      <button

        class="market"

        data-market="BOTH_HALVES"

        type="button">

        Both Teams Score Both Halves

      </button>

    </nav>

    <!-- LAST UPDATED -->

    <div id="updated" class="updated">

      Last updated: —

    </div>

    <!-- DAILY CONTENT -->

    <div id="app">

      <div class="loading">

        Loading Goal Hunter...

      </div>

    </div>

    <!-- FOOTER -->

    <footer>

      <strong>⚽ Goal Hunter</strong>

      <span>

        Model percentages are estimates, not guarantees.

      </span>

    </footer>

  </main>

  <!-- JAVASCRIPT -->

  <script src="app.js"></script>

</body>

</html>
